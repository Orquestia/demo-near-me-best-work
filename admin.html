<style>
  body { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

  .brand .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
  .brand b { color: #fff; font-family: var(--display); font-size: 16px; display: block; }
  .brand small { font-size: 12px; color: #94a3b8; }
  .nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; font-weight: 700; padding: 14px 10px 6px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; text-decoration: none; font-size: 14px; font-weight: 500; color: #cbd5e1; cursor: pointer; }
  .nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav a.on { background: rgba(212,167,44,.14); color: var(--gold); }
  .nav a svg { width: 18px; height: 18px; flex: none; }
  .nav a .count { margin-left: auto; background: var(--gold); color: var(--navy); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .nav a.locked { color: #64748b; }
  .nav a.locked .lk { margin-left: auto; font-size: 10px; border: 1px solid #334155; border-radius: 6px; padding: 1px 6px; }

  main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,246,249,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 14px 28px; }
  .topbar h1 { font-size: 21px; color: var(--navy); }
  .topbar .date { color: var(--muted); font-size: 13.5px; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .side-role { display: grid; gap: 6px; padding: 0 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; font-weight: 700; }
  .side-role select { width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #fff; border-radius: 9px; padding: 9px 10px; font-size: 13.5px; font-weight: 600; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .side-role select option { color: var(--ink); }
  .side-foot { margin-top: auto; display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
  .btn-side { width: 100%; background: rgba(255,255,255,.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,.14); }
  .btn-side:hover { background: rgba(212,167,44,.16); color: var(--gold); border-color: rgba(212,167,44,.4); }
  .content { padding: 24px 28px 100px; display: grid; gap: 20px; }

  .grid { display: grid; gap: 20px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g32 { grid-template-columns: 1.6fr 1fr; }
  @media (max-width: 1200px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g32, .g2 { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
  .card h3 { font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .kpi small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .kpi .v { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--navy); margin: 6px 0 4px; letter-spacing: -.01em; }
  .kpi .s { font-size: 13px; color: var(--muted); }
  .kpi .s b { color: var(--green); }
  .kpi.hl { background: var(--navy); border-color: var(--navy); }
  .kpi.hl small, .kpi.hl .s { color: #94a3b8; }
  .kpi.hl .v { color: var(--gold); }

  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 11px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover td { background: #f8fafc; }
  table.t tr.new td { background: #fffbeb; }
  .tw { overflow-x: auto; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .sm { font-size: 12.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .thumbs { display: flex; gap: 4px; }
  .thumbs img { width: 40px; height: 30px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }

  .bars { display: flex; align-items: flex-end; gap: 3px; height: 160px; padding-top: 10px; }
  .bars .b { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; border-radius: 3px 3px 0 0; overflow: hidden; }
  .bars .b span { display: block; }
  .bars .b:hover { filter: brightness(1.1); }
  .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .hbar { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-size: 13.5px; margin: 8px 0; }
  .hbar .track { background: #f1f5f9; border-radius: 6px; height: 12px; overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 6px; }

  .feed { display: grid; gap: 10px; max-height: 330px; overflow-y: auto; }
  .feed .ev { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; }
  .feed .ev .ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; }
  .feed .ev time { display: block; font-size: 11.5px; color: var(--muted); }
  .alert { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
  .alert:hover { border-color: var(--blue); }
  .alert .n { font-family: var(--display); font-weight: 700; font-size: 18px; min-width: 28px; text-align: center; }
  .alert.warn .n { color: #b45309; } .alert.red .n { color: var(--red); } .alert.ok .n { color: var(--green); }

  .pipeline { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: #eef1f5; border-radius: 14px; padding: 12px; min-height: 240px; }
  .col h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; margin: 2px 4px 10px; }
  .lead { background: #fff; border-radius: 11px; padding: 12px; margin-bottom: 9px; border: 1px solid var(--line); cursor: pointer; display: grid; gap: 7px; }
  .lead:hover { border-color: var(--blue); box-shadow: var(--shadow); }
  .lead[draggable] { cursor: grab; }
  .lead.dragging { opacity: .4; }
  .col.drop-over { background: #dfe7f2; box-shadow: inset 0 0 0 2px var(--blue); }
  .lead.new { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,167,44,.18); }
  .lead b { color: var(--navy); font-size: 14.5px; }
  .lead .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .filters button.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; }
  .job { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 11px; padding: 12px; margin-bottom: 9px; cursor: pointer; display: grid; gap: 6px; font-size: 13.5px; }
  .job:hover { box-shadow: var(--shadow); }
  .job.done { border-left-color: var(--green); }
  .job.prog { border-left-color: var(--gold); }
  .job b { color: var(--navy); }

  .drawer-bg { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 100; display: none; }
  .drawer-bg.on { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #fff; z-index: 101; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,.15); }
  .drawer.on { transform: none; }
  .drawer .dh { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .drawer .dh h2 { font-size: 20px; color: var(--navy); }
  .drawer .db { padding: 20px 24px 40px; overflow-y: auto; display: grid; gap: 18px; align-content: start; flex: 1; }
  .x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 500; }
  .sec-t { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }

  .wa { background: #efeae2; border-radius: 14px; padding: 14px; display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
  .wa .m { max-width: 82%; padding: 8px 11px 6px; border-radius: 10px; font-size: 14px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .wa .m time { display: block; text-align: right; font-size: 10.5px; color: #667781; margin-top: 2px; }
  .wa .in { background: #fff; justify-self: start; border-top-left-radius: 2px; }
  .wa .out { background: #d9fdd3; justify-self: end; border-top-right-radius: 2px; }
  .wa .empty { text-align: center; color: #667781; font-size: 13px; }
  .wa-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .wa-head .g { width: 9px; height: 9px; border-radius: 50%; background: #25D366; }
  .reply { display: flex; gap: 8px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }

  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ba img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .gitem { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .gitem .ba { gap: 2px; }
  .gitem .ba img { border-radius: 0; border: 0; }
  .gitem .cap { padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }

  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 150; display: none; align-items: flex-start; justify-content: center; padding: 60px 16px; overflow-y: auto; }
  .modal-bg.on { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; padding: 24px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
  .modal h3 { color: var(--navy); font-size: 19px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .checks label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .locked-view { text-align: center; padding: 70px 20px; display: grid; gap: 12px; justify-items: center; }
  .locked-view .lock { width: 64px; height: 64px; border-radius: 18px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-size: 28px; }
  .banner { background: linear-gradient(90deg, var(--navy), var(--blue)); color: #fff; border-radius: var(--radius); padding: 16px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .banner b { color: var(--gold); }
  .banner .btn { margin-left: auto; }
  .progress { height: 8px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
  .progress div { height: 100%; background: var(--green); border-radius: 6px; transition: width .3s; }
  .mig { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  @media (max-width: 900px) {
    body { grid-template-columns: 212px minmax(0, 1fr); }
    aside.side { padding: 16px 10px; }
    .nav a { font-size: 13.5px; padding: 8px; }
    .g2, .g32 { grid-template-columns: minmax(0, 1fr); }
    .kv { grid-template-columns: 110px 1fr; }
    .content { padding: 16px 16px 100px; }
    .topbar { padding: 12px 16px; flex-wrap: wrap; }
    .g4 { grid-template-columns: 1fr 1fr; }
  }
  /* Phones only: the sidebar becomes a horizontal strip above the content. */
  @media (max-width: 600px) {
    body { grid-template-columns: minmax(0, 1fr); }
    aside.side { position: static; height: auto; padding: 12px 12px 10px; }
    .brand { padding: 0 4px 10px; margin-bottom: 8px; }
    aside.side .nav { display: flex; flex: none; gap: 4px; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
    .nav-group { display: none; }
    .nav a { white-space: nowrap; flex: none; }
    .topbar { position: static; }
    .side-foot { grid-template-columns: 1fr 1fr; padding-top: 10px; }
    .g4 { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<script>
const { PLANS, SERVICES, TECHS, USERS, PAY_METHODS, helpers: H } = DB;
const { usd, esc, svc, tech, fmtDate } = H;

const ICONS = {
  panel: '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
  crm: '<path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-3 11H7v-2h10v2zm0-3H7V8h10v2z"/>',
  trabajos: '<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/>',
  clientes: '<path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/>',
  membresias: '<path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/>',
  contabilidad: '<path d="M4 4h16v4H4zm0 6h7v10H4zm9 0h7v4h-7zm0 6h7v4h-7z"/>',
  galeria: '<path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>',
  config: '<path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1L11 21h4l.4-2.9a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5-2.2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>',
  lock: '<path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z"/>',
};
const ico = (k) => `<svg viewBox="0 0 24 24" fill="currentColor">${ICONS[k]}</svg>`;

const VIEWS = [
  { id: 'panel', label: 'Panel', group: 'Operación' },
  { id: 'crm', label: 'CRM y WhatsApp', group: 'Operación' },
  { id: 'trabajos', label: 'Trabajos y agenda', group: 'Operación' },
  { id: 'clientes', label: 'Clientes', group: 'Operación' },
  { id: 'membresias', label: 'Membresías', group: 'Operación' },
  { id: 'contabilidad', label: 'Resumen diario', group: 'Finanzas' },
  { id: 'galeria', label: 'Galería antes/después', group: 'Marketing' },
  { id: 'config', label: 'Configuración', group: 'Ajustes' },
];
const LOCKED = [
  { id: 'm5', label: 'Agente de ventas IA', mod: 'M5', desc: 'El método de venta de David por escrito y un agente que responde y califica leads con ese método, conectado a este CRM.' },
  { id: 'm7', label: 'Contabilidad completa', mod: 'M7', desc: 'Ingresos, gastos y reportes para la contadora dentro de la plataforma, para reemplazar QuickBooks.' },
  { id: 'm8', label: 'Inventario', mod: 'M8', desc: 'Químicos, materiales y consumo por trabajo.' },
  { id: 'm9', label: 'Tienda en línea', mod: 'M9', desc: 'Venta de productos de mantenimiento, cuando David defina sus proveedores.' },
];
const ROLE_VIEWS = {
  owner: VIEWS.map((v) => v.id),
  crm: ['panel', 'crm', 'trabajos', 'clientes', 'membresias', 'galeria'],
  conta: ['contabilidad', 'membresias'],
  tech: [],
};

const ui = { view: 'panel', role: 'owner', leadFilter: 'Todos', jobDate: H.today(), contaDate: H.today(), clientQ: '' };
let S = DB.load();
let seenEvents = new Set(S.events.map((e) => e.id));

// ---------- derived helpers ----------
const client = (id) => S.clients.find((c) => c.id === id) || { name: 'Cliente', address: '', phone: '' };
const memberOf = (cid) => S.members.find((m) => m.clientId === cid && m.status === 'activa');
const monthlyEq = (m) => (m.billing === 'annual' ? m.price / 12 : m.price);
const mrr = () => S.members.filter((m) => m.status === 'activa').reduce((s, m) => s + monthlyEq(m), 0);
const svcList = (ids) => ids.map((id) => svc(id).es).join(' + ') || 'Por definir';
const statusChip = (s) => ({ programado: '<span class="chip gray">Programado</span>', en_curso: '<span class="chip gold">En curso</span>', completado: '<span class="chip green">Completado</span>' }[s] || s);
const planChip = (p) => `<span class="chip ${p === 'gold' ? 'gold' : p === 'platinum' ? 'sky' : 'gray'}">${PLANS[p].name}</span>`;
const originChip = (o) => `<span class="chip ${o === 'Orgánico' ? 'green' : o === 'Thumbtack' ? 'red' : o === 'Google' ? 'sky' : 'gold'}">${o}</span>`;
const thumbs = (arr) => `<div class="thumbs">${(arr || []).slice(0, 2).map((p) => `<img src="${H.photoSrc(p)}" alt="">`).join('')}</div>`;
const timeAgo = (isoStr) => { const d = (Date.now() - new Date(isoStr).getTime()) / 60000; return d < 1 ? 'ahora' : d < 60 ? `hace ${Math.round(d)} min` : d < 1440 ? `hace ${Math.round(d / 60)} h` : fmtDate(isoStr.slice(0, 10)); };

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span>' + msg + '</span>';
  document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 5000);
}
function save(fn, ev) { DB.update(fn, ev); S = DB.load(); if (ev) seenEvents.add(S.events[0].id); render(); }

// ---------- shell ----------
function renderNav() {
  const allowed = ROLE_VIEWS[ui.role];
  const newLeads = S.leads.filter((l) => l.status === 'nuevo').length;
  const pendingVisits = S.members.flatMap((m) => m.visits).filter((v) => v.status === 'pendiente' && v.due <= H.addDays(H.today(), 14)).length;
  let html = '', group = '';
  VIEWS.filter((v) => allowed.includes(v.id)).forEach((v) => {
    if (v.group !== group) { group = v.group; html += `<div class="nav-group">${group}</div>`; }
    const count = v.id === 'crm' && newLeads ? newLeads : v.id === 'membresias' && pendingVisits ? pendingVisits : 0;
    html += `<a data-go="${v.id}" class="${ui.view === v.id ? 'on' : ''}">${ico(v.id)}${v.label}${count ? `<span class="count">${count}</span>` : ''}</a>`;
  });
  if (ui.role === 'owner') {
    html += '<div class="nav-group">Fase 2 · extensiones</div>';
    LOCKED.forEach((l) => { html += `<a data-go="${l.id}" class="locked ${ui.view === l.id ? 'on' : ''}">${ico('lock')}${l.label}<span class="lk">${l.mod}</span></a>`; });
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  const allowed = ROLE_VIEWS[ui.role];
  if (ui.role !== 'owner' && !allowed.includes(ui.view)) ui.view = allowed[0] || 'none';
  renderNav();
  const v = VIEWS.find((x) => x.id === ui.view) || LOCKED.find((x) => x.id === ui.view);
  document.getElementById('title').textContent = v ? v.label : 'Técnicos';
  const el = document.getElementById('content');
  const fn = { panel: vPanel, crm: vCrm, trabajos: vTrabajos, clientes: vClientes, membresias: vMembresias, contabilidad: vConta, galeria: vGaleria, config: vConfig }[ui.view];
  el.innerHTML = ui.role === 'tech' ? vTech() : fn ? fn() : vLocked(LOCKED.find((x) => x.id === ui.view));
}

      <dl class="kv"><dt>Teléfono</dt><dd>${esc(c.phone)}</dd><dt>Email</dt><dd>${esc(c.email || '—')}</dd><dt>Dirección</dt><dd>${esc(c.address)}</dd>${c.sqft ? `<dt>Área habitable</dt><dd>${c.sqft.toLocaleString('en-US')} pie² (registro del condado)</dd>` : ''}<dt>Total pagado</dt><dd>${usd(pays.reduce((s, p) => s + p.amount, 0))}</dd></dl>

        <table class="t sm"><tbody>${m.visits.map((v) => `<tr><td>${svc(v.svc).es}</td><td>${fmtDate(v.due)}</td><td class="num">${v.status === 'hecha' ? '<span class="chip green">Hecha</span>' : v.status === 'agendada' ? '<span class="chip sky">Agendada</span>' : `<button class="btn btn-navy btn-sm" data-sched="${m.id}|${v.id}">Agendar</button>`}</td></tr>`).join('')}</tbody></table></div>` : `<button class="btn btn-ghost" data-act="soon">Ofrecer membresía por WhatsApp</button>`}
      <div><div class="sec-t">Historial de trabajos</div>
        ${jobs.map((j) => `<div class="job ${j.status === 'completado' ? 'done' : ''}" data-job="${j.id}"><div style="display:flex; justify-content:space-between"><b>${fmtDate(j.date, { day: 'numeric', month: 'short', year: 'numeric' })}</b>${statusChip(j.status)}</div><div class="sm">${svcList(j.services)} · ${j.memberId ? 'Membresía' : usd(j.amount)}</div>${j.after.length ? thumbs([...j.before, ...j.after]) : ''}</div>`).join('') || '<div class="muted sm">Aún sin trabajos.</div>'}

      <div class="field">Servicios<div class="checks">${SERVICES.map((s) => `<label><input type="checkbox" name="svc" value="${s.id}" ${services.includes(s.id) ? 'checked' : ''} ${memberRef ? 'disabled' : ''}>${s.es}</label>`).join('')}</div></div>

// ---------- events ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-lead],[data-job],[data-client],[data-act],[data-lf],[data-day],[data-cday],[data-sched],[data-qr]');
  if (!t) return;
  const d = t.dataset;
  if (d.act === 'share') { e.stopPropagation(); toast('Foto lista para publicar (en la versión real se descarga en formato para Instagram y TikTok).'); return; }
  if (d.go) { ui.view = d.go; closeDrawer(); render(); window.scrollTo(0, 0); return; }
  if (d.lead) return leadDrawer(d.lead);
  if (d.job) return jobDrawer(d.job);
  if (d.client) return clientDrawer(d.client);
  if (d.lf) { ui.leadFilter = d.lf; return render(); }
  if (d.day !== undefined) { ui.jobDate = d.day === '0' ? H.today() : H.addDays(ui.jobDate, Number(d.day)); return render(); }
  if (d.cday !== undefined) { ui.contaDate = d.cday === '0' ? H.today() : H.addDays(ui.contaDate, Number(d.cday)); return render(); }
  if (d.sched) {
    const [mid, vid] = d.sched.split('|');
    const m = S.members.find((x) => x.id === mid), v = m.visits.find((x) => x.id === vid);
    return jobModal({ clientId: m.clientId, services: [v.svc], date: v.due < H.today() ? H.addDays(H.today(), 1) : v.due, memberRef: d.sched, title: `Agendar ${svc(v.svc).es} · membresía ${PLANS[m.plan].name}` });
  }
  if (d.qr) {
    const l = S.leads.find((x) => x.id === ui.drawer[1]);
    const lastIn = [...l.messages].reverse().find((m) => m.dir === 'in');
    const es = lastIn ? /\b(hola|necesito|quiero|gracias|casa|me|el|la|por favor)\b/i.test(lastIn.text) : l.channel === 'Walk-in';
    const first = l.name.split(' ')[0];
    const text = es
      ? { quote: `Hola ${first}, gracias por escribirnos. Para ${svcList(l.services).toLowerCase()} el valor es ${usd(l.value)}. ¿Qué día le queda bien?`, member: 'Por cierto: su casa puede quedar así todo el año desde $34 al mes con nuestra membresía. Vea su precio aquí: nearmebestwork.com/membership', photos: '¿Nos puede enviar un par de fotos del área para darle el precio exacto?' }[d.qr]
      : { quote: `Hi ${first}, thanks for reaching out! ${l.services.map((id) => svc(id).name).join(' + ')} comes to ${usd(l.value)}. What day works best for you?`, member: 'By the way: your home can stay this clean all year from $34/month with our Best Work Membership. See your price: nearmebestwork.com/membership', photos: 'Could you send us a couple of photos of the area so we can give you an exact price?' }[d.qr];
    document.querySelector('#replyForm input').value = text; return;
  }
  switch (d.act) {
    case 'close': return closeDrawer();
    case 'closeModal': return closeModal();
    case 'newJob': return jobModal();
    case 'newLead': return openModal(`<h3>Registrar lead</h3><form id="leadForm" style="display:grid; gap:12px">
      <div class="row2"><label class="field">Nombre<input class="input" name="name" required></label><label class="field">Teléfono<input class="input" name="phone" required></label></div>
      <div class="row2"><label class="field">Canal<select class="input" name="channel"><option>Llamada</option><option>Walk-in</option><option>WhatsApp</option></select></label><label class="field">Origen<select class="input" name="origin"><option>Orgánico</option><option>Referido</option><option>Google</option><option>Thumbtack</option></select></label></div>
      <div class="field">Interés<div class="checks">${SERVICES.map((s) => `<label><input type="checkbox" name="svc" value="${s.id}">${s.es}</label>`).join('')}</div></div>
      <div style="display:flex; gap:8px; justify-content:flex-end"><button type="button" class="btn btn-ghost" data-act="closeModal">Cancelar</button><button class="btn btn-navy">Guardar</button></div></form>`);
    case 'convert': {
      const l = S.leads.find((x) => x.id === d.id);
      let c = S.clients.find((x) => x.name === l.name);
      if (!c) { const cid = H.uid('c'); save((s) => { s.clients.unshift({ id: cid, name: l.name, phone: l.phone, email: '', address: 'Dirección por confirmar, Orlando, FL', sqft: null, origin: l.origin, createdAt: H.today() }); }); c = S.clients.find((x) => x.id === cid); }
      closeDrawer();
      return jobModal({ clientId: c.id, services: l.services, title: `Agendar trabajo · ${l.name}`, leadId: l.id });
    }
    case 'sendReport': save((s) => { s.reportsSent[ui.contaDate] = new Date().toISOString(); }, { kind: 'report', text: `Resumen del ${fmtDate(ui.contaDate)} enviado a la contadora` }); return toast('Resumen enviado a Patricia (simulado). En la versión real le llega por correo y lo ve en su usuario.');
    case 'csv': {
      const rows = [['fecha', 'tipo', 'cliente/concepto', 'medio', 'monto']];
      S.payments.filter((p) => p.date === ui.contaDate).forEach((p) => rows.push([p.date, 'entró · ' + p.type, client(p.clientId).name, p.method, p.amount]));
      S.expenses.filter((x) => x.date === ui.contaDate).forEach((x) => rows.push([x.date, 'salió', x.concept, '', -x.amount]));
      const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')); a.download = `resumen-${ui.contaDate}.csv`; a.click(); return;
    }
    case 'migrate': {
      const box = document.getElementById('mig-' + d.id), bar = box.querySelector('.progress div'); t.disabled = true; let p = 0;
      const iv = setInterval(() => { p += 9; bar.style.width = Math.min(p, 100) + '%'; if (p >= 100) { clearInterval(iv); t.textContent = d.id === 'zoho' ? '42 clientes y 186 trabajos importados' : 'Ingresos y gastos del año importados'; toast('Importación simulada completa. En F0 se hace con los datos reales de David.'); } }, 120); return;
    }
    case 'soon': return toast('Disponible en la versión real.');
  }
});
document.getElementById('drawerBg').onclick = closeDrawer;
document.getElementById('modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') closeModal(); });

document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f);
  if (f.id === 'replyForm') {
    const text = fd.get('t').trim(); if (!text) return;
    const id = ui.drawer[1];
    save((s) => { const l = s.leads.find((x) => x.id === id); l.messages.push({ dir: 'out', text, at: new Date().toISOString().slice(0, 16) }); if (l.status === 'nuevo') l.status = 'contactado'; });
    leadDrawer(id);
  }
  if (f.id === 'jobForm') {
    const memberRef = fd.get('memberRef'), leadId = fd.get('leadId');
    let clientId = fd.get('clientId'), services = fd.getAll('svc');
    let memberId = null;
    if (memberRef) { const [mid, vid] = memberRef.split('|'); const m = S.members.find((x) => x.id === mid); clientId = m.clientId; services = [m.visits.find((v) => v.id === vid).svc]; memberId = mid; }
    if (!services.length) return toast('Elige al menos un servicio.');
    const job = { id: H.uid('j'), clientId, date: fd.get('date'), time: fd.get('time'), services, techId: fd.get('techId'), status: 'programado', amount: memberId ? 0 : services.reduce((s, id) => s + svc(id).price, 0), method: '', before: [], after: [], notes: fd.get('notes') || '', completedAt: null, memberId };
    save((s) => {
      s.jobs.push(job);
      if (memberRef) { const [mid, vid] = memberRef.split('|'); const v = s.members.find((x) => x.id === mid).visits.find((x) => x.id === vid); v.status = 'agendada'; v.jobId = job.id; v.due = job.date; }
      if (leadId) s.leads.find((x) => x.id === leadId).status = 'ganado';
    });
    closeModal(); closeDrawer();
    toast(`Agendado con ${tech(job.techId).name} el ${fmtDate(job.date)} a las ${job.time}. ${job.date === H.today() ? 'Ya aparece en su app.' : ''}`);
  }
  if (f.id === 'leadForm') {
    const services = fd.getAll('svc');
    save((s) => s.leads.unshift({ id: H.uid('l'), name: fd.get('name'), phone: fd.get('phone'), channel: fd.get('channel'), origin: fd.get('origin'), status: 'nuevo', services, value: services.reduce((a, id) => a + svc(id).price, 0), createdAt: H.today(), messages: [] }), { kind: 'lead', text: `Lead registrado (${fd.get('channel')}) · ${fd.get('name')}` });
    closeModal();
  }
  if (f.id === 'expForm') save((s) => s.expenses.push({ id: H.uid('e'), date: ui.contaDate, concept: fd.get('concept'), amount: Number(fd.get('amount')) }));
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'jobDate') { ui.jobDate = e.target.value; render(); }
  if (e.target.id === 'contaDate') { ui.contaDate = e.target.value; render(); }
  if (e.target.id === 'leadStatus') { const id = ui.drawer[1]; save((s) => (s.leads.find((x) => x.id === id).status = e.target.value)); }
  if (e.target.id === 'reassign') { const id = ui.drawer[1]; save((s) => (s.jobs.find((x) => x.id === id).techId = e.target.value)); toast('Técnico reasignado. El trabajo cambia de app al instante.'); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'clientQ') { ui.clientQ = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('clientQ'); el.focus(); el.setSelectionRange(pos, pos); }
});

// CRM pipeline: drag a lead card onto another column to change its stage.
const STAGE_LABEL = { nuevo: 'Nuevos', contactado: 'Contactados', cotizado: 'Cotizados', ganado: 'Ganados', perdido: 'Perdidos' };
let dragLead = null;
document.addEventListener('dragstart', (e) => {
  const card = e.target.closest?.('.lead[data-lead]'); if (!card) return;
  dragLead = card.dataset.lead;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragLead);
  requestAnimationFrame(() => card.classList.add('dragging'));
});
document.addEventListener('dragover', (e) => {
  const col = dragLead && e.target.closest('.col[data-status]'); if (!col) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.col.drop-over').forEach((c) => c !== col && c.classList.remove('drop-over'));
  col.classList.add('drop-over');
});
document.addEventListener('drop', (e) => {
  const col = dragLead && e.target.closest('.col[data-status]'); if (!col) return;
  e.preventDefault();
  const id = dragLead, status = col.dataset.status;
  const l = S.leads.find((x) => x.id === id);
  dragLead = null;
  if (!l || l.status === status) return render();
  save((s) => { const x = s.leads.find((y) => y.id === id); x.status = status; delete x.isNew; });
  toast(`${esc(l.name)} pasó a <b>${STAGE_LABEL[status]}</b>.${status === 'ganado' ? ' Ábrela para convertirla en cliente y agendar.' : ''}`);
});
document.addEventListener('dragend', () => {
  dragLead = null;
  document.querySelectorAll('.dragging, .drop-over').forEach((el) => el.classList.remove('dragging', 'drop-over'));
});

const roleSel = document.getElementById('role');
roleSel.innerHTML = USERS.map((u) => `<option value="${u.id}">${u.name} · ${u.role}</option>`).join('');
roleSel.onchange = () => { ui.role = roleSel.value; ui.view = ROLE_VIEWS[ui.role][0] || 'panel'; closeDrawer(); render(); };
document.getElementById('resetBtn').onclick = () => { if (confirm('¿Volver a los datos de ejemplo? Se borra lo que se haya creado en la demo.')) { DB.reset(); S = DB.load(); seenEvents = new Set(); closeDrawer(); render(); toast('Demo reiniciada.'); } };
document.getElementById('today').textContent = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

// Live updates from the landing and the field app (other tabs).
DB.onChange((ns) => {
  S = ns;
  ns.events.filter((ev) => !seenEvents.has(ev.id)).reverse().forEach((ev) => { seenEvents.add(ev.id); toast('<b>En vivo</b> · ' + esc(ev.text)); });
  render();
  if (ui.drawer) ({ lead: leadDrawer, job: jobDrawer, client: clientDrawer })[ui.drawer[0]]?.(ui.drawer[1]);
});

render();
DB.ready().then(() => { S = DB.load(); seenEvents = new Set(S.events.map((e) => e.id)); render(); });
</script>
</body>
</html>
