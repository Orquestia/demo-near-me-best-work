<title>Best Work 360 · Plataforma central (demo)</title>

<style>
  body { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  aside.side { background: var(--navy); color: #cbd5e1; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
  aside.side .nav { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 20px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 14px; }
  .brand .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
  .brand b { color: #fff; font-family: var(--display); font-size: 16px; display: block; }
  .brand small { font-size: 12px; color: #94a3b8; }
  .nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; font-weight: 700; padding: 14px 10px 6px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; text-decoration: none; font-size: 14px; font-weight: 500; color: #cbd5e1; cursor: pointer; }
  .nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav a.on { background: rgba(212,167,44,.14); color: var(--gold); }
  .nav a svg { width: 18px; height: 18px; flex: none; }
  .nav a .count { margin-left: auto; background: var(--gold); color: var(--navy); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .nav a.locked { color: #64748b; }
  .nav a.locked .lk { margin-left: auto; font-size: 10px; border: 1px solid #334155; border-radius: 6px; padding: 1px 6px; }

  main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,246,249,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 14px 28px; }
  .topbar h1 { font-size: 21px; color: var(--navy); }
  .topbar .date { color: var(--muted); font-size: 13.5px; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .side-role { display: grid; gap: 6px; padding: 0 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #64748b; font-weight: 700; }
  .side-role select { width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #fff; border-radius: 9px; padding: 9px 10px; font-size: 13.5px; font-weight: 600; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .side-role select option { color: var(--ink); }
  .side-foot { margin-top: auto; display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
  .btn-side { width: 100%; background: rgba(255,255,255,.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,.14); }
  .btn-side:hover { background: rgba(212,167,44,.16); color: var(--gold); border-color: rgba(212,167,44,.4); }
  .content { padding: 24px 28px 100px; display: grid; gap: 20px; }

  .grid { display: grid; gap: 20px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g32 { grid-template-columns: 1.6fr 1fr; }
  @media (max-width: 1200px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g32, .g2 { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
  .card h3 { font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .kpi small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .kpi .v { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--navy); margin: 6px 0 4px; letter-spacing: -.01em; }
  .kpi .s { font-size: 13px; color: var(--muted); }
  .kpi .s b { color: var(--green); }
  .kpi.hl { background: var(--navy); border-color: var(--navy); }
  .kpi.hl small, .kpi.hl .s { color: #94a3b8; }
  .kpi.hl .v { color: var(--gold); }

  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 11px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover td { background: #f8fafc; }
  table.t tr.new td { background: #fffbeb; }
  .tw { overflow-x: auto; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .sm { font-size: 12.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .thumbs { display: flex; gap: 4px; }
  .thumbs img { width: 40px; height: 30px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }

  .bars { display: flex; align-items: flex-end; gap: 3px; height: 160px; padding-top: 10px; }
  .bars .b { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; border-radius: 3px 3px 0 0; overflow: hidden; }
  .bars .b span { display: block; }
  .bars .b:hover { filter: brightness(1.1); }
  .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .hbar { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-size: 13.5px; margin: 8px 0; }
  .hbar .track { background: #f1f5f9; border-radius: 6px; height: 12px; overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 6px; }

  .feed { display: grid; gap: 10px; max-height: 330px; overflow-y: auto; }
  .feed .ev { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; }
  .feed .ev .ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; }
  .feed .ev time { display: block; font-size: 11.5px; color: var(--muted); }
  .alert { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
  .alert:hover { border-color: var(--blue); }
  .alert .n { font-family: var(--display); font-weight: 700; font-size: 18px; min-width: 28px; text-align: center; }
  .alert.warn .n { color: #b45309; } .alert.red .n { color: var(--red); } .alert.ok .n { color: var(--green); }

  .pipeline { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: #eef1f5; border-radius: 14px; padding: 12px; min-height: 240px; }
  .col h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; margin: 2px 4px 10px; }
  .lead { background: #fff; border-radius: 11px; padding: 12px; margin-bottom: 9px; border: 1px solid var(--line); cursor: pointer; display: grid; gap: 7px; }
  .lead:hover { border-color: var(--blue); box-shadow: var(--shadow); }
  .lead[draggable] { cursor: grab; }
  .lead.dragging { opacity: .4; }
  .col.drop-over { background: #dfe7f2; box-shadow: inset 0 0 0 2px var(--blue); }
  .lead.new { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,167,44,.18); }
  .lead b { color: var(--navy); font-size: 14.5px; }
  .lead .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .filters button.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; }
  .seg { display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--navy); color: #fff; }
  .cal { display: grid; grid-template-rows: 46px auto; align-content: start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 250px); position: relative; }
  .cal-corner, .cal-head { position: sticky; top: 0; z-index: 3; background: #fff; border-bottom: 1px solid var(--line); }
  .cal-head { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; font-size: 13px; font-weight: 600; color: var(--navy); border-left: 1px solid var(--line); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-head[data-calgo] { cursor: pointer; }
  .cal-head[data-calgo]:hover { background: var(--bg); }
  .cal-head .wd { text-transform: capitalize; color: var(--muted); font-weight: 500; }
  .cal-head .dn { font-family: var(--display); font-size: 16px; }
  .cal-head.today .dn { background: var(--gold); color: var(--navy); border-radius: 999px; padding: 1px 8px; }
  .cal-hours div { font-size: 11px; color: var(--muted); text-align: right; padding: 0 8px; transform: translateY(-7px); }
  .cal-hours div:first-child { transform: none; }
  .cal-col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 32px, #f6f8fb 32px, #f6f8fb 33px, transparent 33px, transparent 66px); }
  .slot { position: absolute; left: 0; right: 0; border-top: 1px solid #f1f5f9; cursor: copy; }
  .slot:hover { background: #f8fafc; }
  .now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); z-index: 2; pointer-events: none; }
  .now-line::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .ev { position: absolute; z-index: 1; border-left: 3px solid; border-radius: 9px; padding: 5px 8px; font-size: 12.5px; line-height: 1.3; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 1px; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .ev:hover { box-shadow: var(--shadow); z-index: 4; }
  .ev.done { opacity: .62; }
  .ev b { font-size: 11.5px; color: var(--navy); }
  .ev-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .month { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .mh { padding: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); text-align: center; }
  .mc { min-height: 104px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; padding: 6px; cursor: pointer; display: grid; gap: 3px; align-content: start; }
  .mc:hover { background: #f8fafc; }
  .mc.out { background: #fafbfc; color: #cbd5e1; }
  .mn { font-size: 12.5px; font-weight: 600; }
  .mc.today .mn { background: var(--gold); color: var(--navy); border-radius: 999px; width: 24px; height: 24px; display: grid; place-items: center; }
  .mchip { font-size: 11.5px; border-left: 3px solid; background: #f1f5f9; border-radius: 5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .more { font-size: 11.5px; color: var(--muted); padding-left: 4px; }
  .filters button .dot { margin-right: 4px; }
  .pinrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pinval { color: var(--navy); font-family: var(--display); letter-spacing: .12em; min-width: 46px; }
  .pin-input { font-family: var(--display); font-size: 22px; letter-spacing: .5em; text-align: center; }
  .form-err { color: var(--red); font-size: 13px; font-weight: 600; min-height: 16px; margin: 0; }
  .job { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 11px; padding: 12px; margin-bottom: 9px; cursor: pointer; display: grid; gap: 6px; font-size: 13.5px; }
  .job:hover { box-shadow: var(--shadow); }
  .job.done { border-left-color: var(--green); }
  .job.prog { border-left-color: var(--gold); }
  .job b { color: var(--navy); }

  .drawer-bg { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 100; display: none; }
  .drawer-bg.on { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #fff; z-index: 101; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,.15); }
  .drawer.on { transform: none; }
  .drawer .dh { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .drawer .dh h2 { font-size: 20px; color: var(--navy); }
  .drawer .db { padding: 20px 24px 40px; overflow-y: auto; display: grid; gap: 18px; align-content: start; flex: 1; }
  .x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 500; }
  .sec-t { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }

  .wa { background: #efeae2; border-radius: 14px; padding: 14px; display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
  .wa .m { max-width: 82%; padding: 8px 11px 6px; border-radius: 10px; font-size: 14px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .wa .m time { display: block; text-align: right; font-size: 10.5px; color: #667781; margin-top: 2px; }
  .wa .in { background: #fff; justify-self: start; border-top-left-radius: 2px; }
  .wa .out { background: #d9fdd3; justify-self: end; border-top-right-radius: 2px; }
  .wa .empty { text-align: center; color: #667781; font-size: 13px; }
  .wa-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .wa-head .g { width: 9px; height: 9px; border-radius: 50%; background: #25D366; }
  .reply { display: flex; gap: 8px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }

  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ba img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .gitem { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .gitem .ba { gap: 2px; }
  .gitem .ba img { border-radius: 0; border: 0; }
  .gitem .cap { padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }

  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 150; display: none; align-items: flex-start; justify-content: center; padding: 60px 16px; overflow-y: auto; }
  .modal-bg.on { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; padding: 24px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
  .modal h3 { color: var(--navy); font-size: 19px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .checks label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .locked-view { text-align: center; padding: 70px 20px; display: grid; gap: 12px; justify-items: center; }
  .locked-view .lock { width: 64px; height: 64px; border-radius: 18px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-size: 28px; }
  .banner { background: linear-gradient(90deg, var(--navy), var(--blue)); color: #fff; border-radius: var(--radius); padding: 16px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .banner b { color: var(--gold); }
  .banner .btn { margin-left: auto; }
  .progress { height: 8px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
  .progress div { height: 100%; background: var(--green); border-radius: 6px; transition: width .3s; }
  .mig { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  @media (max-width: 900px) {
    body { grid-template-columns: 212px minmax(0, 1fr); }
    aside.side { padding: 16px 10px; }
    .nav a { font-size: 13.5px; padding: 8px; }
    .g2, .g32 { grid-template-columns: minmax(0, 1fr); }
    .kv { grid-template-columns: 110px 1fr; }
    .content { padding: 16px 16px 100px; }
    .topbar { padding: 12px 16px; flex-wrap: wrap; }
    .g4 { grid-template-columns: 1fr 1fr; }
  }
  /* Phones only: the sidebar becomes a horizontal strip above the content. */
  @media (max-width: 600px) {
    body { grid-template-columns: minmax(0, 1fr); }
    aside.side { position: static; height: auto; padding: 12px 12px 10px; }
    .brand { padding: 0 4px 10px; margin-bottom: 8px; }
    aside.side .nav { display: flex; flex: none; gap: 4px; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
    .nav-group { display: none; }
    .nav a { white-space: nowrap; flex: none; }
    .topbar { position: static; }
    .side-foot { grid-template-columns: 1fr 1fr; padding-top: 10px; }
    .g4 { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---- CRM, assistant and modern touches ---- */
  body { background: radial-gradient(1100px 520px at 105% -8%, #e3ebf7 0%, transparent 60%), var(--bg); }
  .card { border-radius: 16px; border-color: #e6ebf2; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.04); }
  .kpi.hl { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); }
  .kpi .v { font-size: 28px; }
  .nav a { position: relative; }
  .nav a.on::before { content: ''; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--gold); }
  .topbar { background: rgba(244,246,249,.78); }
  .live { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #15803d; background: #ecfdf5; border: 1px solid #bbf7d0; border-radius: 999px; padding: 6px 12px; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.55); animation: pulse 1.8s infinite; flex: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .bot-kpi { background: linear-gradient(135deg, #ecfdf5 0%, #fff 70%); }
  .bot-kpi small { display: flex; align-items: center; gap: 8px; }
  .crm-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  @media (max-width: 1280px) { .crm-layout { grid-template-columns: minmax(0, 1fr); } .tasks { position: static !important; max-height: none !important; } }
  .crm-board { min-width: 0; }
  .pipeline { grid-template-columns: repeat(5, minmax(236px, 1fr)); }
  .col { background: linear-gradient(180deg, #edf1f6, #f3f5f9); }
  .col h4 span:last-child { font-weight: 600; color: var(--navy); text-transform: none; letter-spacing: 0; }
  .lead { border-radius: 13px; }
  .tasks { position: sticky; top: 92px; max-height: calc(100vh - 112px); overflow-y: auto; }
  .task-list { display: grid; gap: 8px; }
  .task { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-left: 4px solid #cbd5e1; border-radius: 12px; background: #fff; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .task:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .task.u-alta { border-left-color: #e05252; } .task.u-media { border-left-color: var(--gold); } .task.u-baja { border-left-color: #cbd5e1; }
  .task.auto { background: #f8fafc; border-left-color: var(--sky); border-style: dashed; border-left-style: solid; }
  .tbody { flex: 1; min-width: 0; display: grid; gap: 4px; }

<script>
const { PLANS, SERVICES, TECHS, USERS, PAY_METHODS, helpers: H } = DB;
const { usd, esc, svc, tech, fmtDate } = H;

const ICONS = {
  panel: '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
  crm: '<path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-3 11H7v-2h10v2zm0-3H7V8h10v2z"/>',
  trabajos: '<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/>',
  clientes: '<path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/>',
  membresias: '<path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/>',
  contabilidad: '<path d="M4 4h16v4H4zm0 6h7v10H4zm9 0h7v4h-7zm0 6h7v4h-7z"/>',
  galeria: '<path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>',
  manual: '<path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM8 6h8v2H8V6zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/>',
  config: '<path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1L11 21h4l.4-2.9a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5-2.2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>',
  lock: '<path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z"/>',
};
const ico = (k) => `<svg viewBox="0 0 24 24" fill="currentColor">${ICONS[k]}</svg>`;

const VIEWS = [
  { id: 'panel', label: 'Panel', group: 'Operación' },
  { id: 'crm', label: 'CRM y WhatsApp', group: 'Operación' },
  { id: 'manual', label: 'Manual de ventas', group: 'Operación' },
  { id: 'trabajos', label: 'Trabajos y agenda', group: 'Operación' },
  { id: 'clientes', label: 'Clientes', group: 'Operación' },
  { id: 'membresias', label: 'Membresías', group: 'Operación' },
  { id: 'contabilidad', label: 'Resumen diario', group: 'Finanzas' },
  { id: 'galeria', label: 'Galería antes/después', group: 'Marketing' },
  { id: 'config', label: 'Configuración', group: 'Ajustes' },
];
const LOCKED = [
  { id: 'm7', label: 'Contabilidad completa', mod: 'M7', desc: 'Ingresos, gastos y reportes para la contadora dentro de la plataforma, para reemplazar QuickBooks.' },
  { id: 'm8', label: 'Inventario', mod: 'M8', desc: 'Químicos, materiales y consumo por trabajo.' },
  { id: 'm9', label: 'Tienda en línea', mod: 'M9', desc: 'Venta de productos de mantenimiento, cuando David defina sus proveedores.' },
];
const ROLE_VIEWS = {
  owner: VIEWS.map((v) => v.id),
  crm: ['panel', 'crm', 'manual', 'trabajos', 'clientes', 'membresias', 'galeria'],
  conta: ['contabilidad', 'membresias'],
  tech: [],
};

const ui = { view: 'panel', role: 'owner', leadFilter: 'Todos', jobDate: H.today(), calMode: 'semana', calTech: 'all', contaDate: H.today(), clientQ: '' };
let S = DB.load();
let seenEvents = new Set(S.events.map((e) => e.id));

// ---------- derived helpers ----------
const client = (id) => S.clients.find((c) => c.id === id) || { name: 'Cliente', address: '', phone: '' };
const memberOf = (cid) => S.members.find((m) => m.clientId === cid && m.status === 'activa');
const monthlyEq = (m) => (m.billing === 'annual' ? m.price / 12 : m.price);
const mrr = () => S.members.filter((m) => m.status === 'activa').reduce((s, m) => s + monthlyEq(m), 0);
const svcList = (ids) => ids.map((id) => svc(id).es).join(' + ') || 'Por definir';
const statusChip = (s) => ({ programado: '<span class="chip gray">Programado</span>', en_curso: '<span class="chip gold">En curso</span>', completado: '<span class="chip green">Completado</span>' }[s] || s);
const planChip = (p) => `<span class="chip ${p === 'gold' ? 'gold' : p === 'platinum' ? 'sky' : 'gray'}">${PLANS[p].name}</span>`;
const originChip = (o) => `<span class="chip ${o === 'Orgánico' ? 'green' : o === 'Thumbtack' ? 'red' : o === 'Google' ? 'sky' : 'gold'}">${o}</span>`;
const thumbs = (arr) => `<div class="thumbs">${(arr || []).slice(0, 2).map((p) => `<img src="${H.photoSrc(p)}" alt="">`).join('')}</div>`;
const timeAgo = (isoStr) => { const d = (Date.now() - new Date(isoStr).getTime()) / 60000; return d < 1 ? 'ahora' : d < 60 ? `hace ${Math.round(d)} min` : d < 1440 ? `hace ${Math.round(d / 60)} h` : fmtDate(isoStr.slice(0, 10)); };
const monthKey = H.today().slice(0, 7);

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span>' + msg + '</span>';
  document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 5000);
}
function save(fn, ev) { DB.update(fn, ev); S = DB.load(); if (ev) seenEvents.add(S.events[0].id); render(); }

// ---------- shell ----------
function renderNav() {
  const allowed = ROLE_VIEWS[ui.role];
  const newLeads = S.leads.filter((l) => l.status === 'nuevo').length;
  const pendingVisits = S.members.flatMap((m) => m.visits).filter((v) => v.status === 'pendiente' && v.due <= H.addDays(H.today(), 14)).length;
  let html = '', group = '';
  VIEWS.filter((v) => allowed.includes(v.id)).forEach((v) => {
    if (v.group !== group) { group = v.group; html += `<div class="nav-group">${group}</div>`; }
    const count = v.id === 'crm' && newLeads ? newLeads : v.id === 'membresias' && pendingVisits ? pendingVisits : 0;
    html += `<a data-go="${v.id}" class="${ui.view === v.id ? 'on' : ''}">${ico(v.id)}${v.label}${count ? `<span class="count">${count}</span>` : ''}</a>`;
  });
  if (ui.role === 'owner') {
    html += '<div class="nav-group">Fase 2 · extensiones</div>';
    LOCKED.forEach((l) => { html += `<a data-go="${l.id}" class="locked ${ui.view === l.id ? 'on' : ''}">${ico('lock')}${l.label}<span class="lk">${l.mod}</span></a>`; });
  }
  document.getElementById('nav').innerHTML = html;
}

function render() {
  const allowed = ROLE_VIEWS[ui.role];
  if (ui.role !== 'owner' && !allowed.includes(ui.view)) ui.view = allowed[0] || 'none';
  renderNav();
  const v = VIEWS.find((x) => x.id === ui.view) || LOCKED.find((x) => x.id === ui.view);
  document.getElementById('title').textContent = v ? v.label : 'Técnicos';
  const el = document.getElementById('content');
  const fn = { panel: vPanel, crm: vCrm, trabajos: vTrabajos, clientes: vClientes, membresias: vMembresias, contabilidad: vConta, galeria: vGaleria, config: vConfig, manual: vManual }[ui.view];
  el.innerHTML = ui.role === 'tech' ? vTech() : fn ? fn() : vLocked(LOCKED.find((x) => x.id === ui.view));
}

// ---------- views ----------
function vPanel() {
  const T = H.today();
  const monthPay = S.payments.filter((p) => p.date.startsWith(monthKey));
  const monthTotal = monthPay.reduce((s, p) => s + p.amount, 0);
  const memberIncome = monthPay.filter((p) => p.type === 'membresía').reduce((s, p) => s + p.amount, 0);
  const todayJobs = S.jobs.filter((j) => j.date === T).sort((a, b) => a.time.localeCompare(b.time));
  const doneToday = todayJobs.filter((j) => j.status === 'completado');
  const active = S.members.filter((m) => m.status === 'activa');
  const weekLeads = S.leads.filter((l) => l.createdAt >= H.addDays(T, -7));
  const organic = weekLeads.filter((l) => l.origin !== 'Thumbtack').length;

  // 30-day revenue bars
  const days = []; for (let i = 29; i >= 0; i--) days.push(H.addDays(T, -i));
  const byDay = days.map((d) => { const ps = S.payments.filter((p) => p.date === d); return { d, job: ps.filter((p) => p.type === 'trabajo').reduce((s, p) => s + p.amount, 0), mem: ps.filter((p) => p.type === 'membresía').reduce((s, p) => s + p.amount, 0) }; });
  const maxDay = Math.max(1, ...byDay.map((x) => x.job + x.mem));

  const origins = ['Orgánico', 'Thumbtack', 'Google', 'Referido'];
  const monthLeads = S.leads.length;
  const oCount = origins.map((o) => [o, S.leads.filter((l) => l.origin === o).length]);
  const oMax = Math.max(1, ...oCount.map((x) => x[1]));
  const oColor = { 'Orgánico': 'var(--green)', 'Thumbtack': '#e05252', 'Google': 'var(--sky)', 'Referido': 'var(--gold)' };

  const overdue = S.members.flatMap((m) => m.visits.map((v) => ({ ...v, m }))).filter((v) => v.status === 'pendiente' && v.due < T);
  const newLeads = S.leads.filter((l) => l.status === 'nuevo');
  const openToday = todayJobs.filter((j) => j.status !== 'completado');
  const sent = S.reportsSent[T];

  return `
  <div class="banner">
    <div>Lo que reportan los técnicos en la app de campo <b>llega aquí solo</b>: trabajos, fotos, cobros y el resumen para la contadora. Nadie lo vuelve a escribir en la noche.</div>
    <a class="btn btn-gold btn-sm" href="app.html" target="_blank">Ver app de campo ↗</a>
  </div>
  <div class="grid g4">
    <div class="card kpi hl"><small>Ingresos del mes</small><div class="v">${usd(monthTotal)}</div><div class="s">${usd(memberIncome)} por membresías</div></div>
    <div class="card kpi"><small>Trabajos de hoy</small><div class="v">${doneToday.length} / ${todayJobs.length}</div><div class="s">${usd(doneToday.reduce((s, j) => s + j.amount, 0))} cobrados hoy</div></div>
    <div class="card kpi"><small>Membresías activas</small><div class="v">${active.length}</div><div class="s"><b>${usd(mrr())}</b> de ingreso fijo al mes</div></div>
    <div class="card kpi"><small>Leads últimos 7 días</small><div class="v">${weekLeads.length}</div><div class="s"><b>${weekLeads.length ? Math.round((organic / weekLeads.length) * 100) : 0}%</b> sin pagar Thumbtack</div></div>
  </div>
  <div class="grid g32">
    <div class="card">
      <div class="card-head"><h3>Trabajos de hoy</h3><a class="btn btn-ghost btn-sm" data-go="trabajos">Ver agenda</a></div>
      <div class="tw"><table class="t">
        <thead><tr><th>Hora</th><th>Cliente</th><th>Servicio</th><th>Técnico</th><th>Estado</th><th>Fotos</th><th class="num">Valor</th></tr></thead>
        <tbody>${todayJobs.map((j) => `<tr class="click" data-job="${j.id}"><td>${j.time}</td><td><b>${esc(client(j.clientId).name)}</b>${j.memberId ? ' <span class="chip sky sm">Miembro</span>' : ''}</td><td class="sm">${svcList(j.services)}</td><td><span class="dot" style="background:${tech(j.techId).color}"></span>${tech(j.techId).name.split(' ')[0]}</td><td>${statusChip(j.status)}</td><td>${j.after.length || j.before.length ? thumbs([...j.before, ...j.after]) : '<span class="muted sm">—</span>'}</td><td class="num">${j.memberId ? '<span class="muted sm">Incluido</span>' : usd(j.amount)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Sin trabajos hoy</td></tr>'}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Pendientes</h3></div>
      <div style="display:grid; gap:8px">
        <div class="alert ${newLeads.length ? 'warn' : 'ok'}" data-go="crm"><span class="n">${newLeads.length}</span>Leads nuevos sin responder</div>
        <div class="alert ${overdue.length ? 'red' : 'ok'}" data-go="membresias"><span class="n">${overdue.length}</span>Visitas de membresía vencidas sin agendar</div>
        <div class="alert ${openToday.length ? 'warn' : 'ok'}" data-go="trabajos"><span class="n">${openToday.length}</span>Trabajos de hoy sin cerrar</div>
        <div class="alert ${sent ? 'ok' : 'warn'}" data-go="contabilidad"><span class="n">${sent ? '✓' : '!'}</span>${sent ? 'Resumen de hoy enviado a la contadora' : 'Resumen de hoy sin enviar a la contadora'}</div>
      </div>
      <div class="sec-t" style="margin-top:18px">Actividad en vivo</div>
      <div class="feed">${S.events.slice(0, 8).map(evHtml).join('') || '<div class="muted sm">Aquí aparece lo que pasa en la web y en la app de campo, en tiempo real.</div>'}</div>
    </div>
  </div>
  <div class="grid g32">
    <div class="card">
      <div class="card-head"><h3>Tareas prioritarias de ventas</h3><a class="btn btn-ghost btn-sm" data-go="crm">Ir al CRM</a></div>
      <div class="task-list">${crmTasks().filter((x) => !x.t.auto && !x.done).slice(0, 4).map(({ l, i, t }) => `<div class="task u-${i.urgency}" data-lead="${l.id}"><div class="tbody"><b>${esc(t.title)}</b><div class="row">${urgChip(i.urgency)}<span class="sm muted">${esc(t.why)}</span></div></div>${probRing(i.prob, 42)}</div>`).join('') || '<div class="muted sm">Sin tareas pendientes.</div>'}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Automatizaciones activas</h3><span class="chip green"><span class="pulse"></span>5 activas</span></div>
      <div class="autos">${[
        ['🤖', 'Asistente de WhatsApp', `Califica cada lead nuevo · ${crmTasks().filter((x) => x.t.auto).length} conversaciones en curso`],

const probColor = (p) => (p >= 70 ? 'var(--green)' : p >= 40 ? 'var(--gold)' : '#e05252');
function probRing(p, size = 38) {
  const r = size / 2 - 4, c = 2 * Math.PI * r;
  return `<span class="ring" style="width:${size}px; height:${size}px" title="Probabilidad de cierre ${p}%"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="#e8edf3" stroke-width="4" fill="none"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${probColor(p)}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${(p / 100) * c} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg><b style="font-size:${size > 50 ? 17 : 10.5}px">${p}%</b></span>`;
}
const urgChip = (u) => `<span class="chip urg-${u}"><i></i>${u === 'alta' ? 'Urgencia alta' : u === 'media' ? 'Urgencia media' : 'Urgencia baja'}</span>`;
const dueLabel = (d) => { const t = H.today(); return d < t ? 'Vencida' : d === t ? 'Hoy' : d === H.addDays(t, 1) ? 'Mañana' : fmtDate(d, { weekday: 'short', day: 'numeric' }); };
const answerText = (qid, key) => { const q = H.QUAL.find((x) => x.id === qid); const o = q && q.opts.find((x) => x[0] === key); return o ? o[1] : key; };

function crmTasks() {
  return S.leads.map((l) => ({ l, i: H.leadInsight(l) })).filter(({ i }) => i.task)

    .sort((a, b) => H.URG_RANK[b.i.urgency] - H.URG_RANK[a.i.urgency] || b.i.prob - a.i.prob);

const MANUAL = window.SALES_MANUAL || [];

function fill(txt, l) {
  if (!l) return txt;
  let next = H.addDays(H.today(), 1); if (new Date(next + 'T12:00:00').getDay() === 0) next = H.addDays(next, 1);
  const en = l.lang !== 'es';
  return txt.replaceAll('{nombre}', l.name.split(' ')[0])
    .replaceAll('{fecha}', new Date(next + 'T12:00:00').toLocaleDateString(en ? 'en-US' : 'es-CO', { weekday: 'long', month: 'long', day: 'numeric' }))
    .replaceAll('{servicios}', l.services.map((id) => (en ? svc(id).name : svc(id).es)).join(' + ') || (en ? 'the service' : 'el servicio'))
    .replaceAll('{servicio}', l.services[0] ? (en ? svc(l.services[0]).name : svc(l.services[0]).es) : (en ? 'the main service' : 'el servicio principal'))
    .replaceAll('{valor}', usd(l.value))
    .replaceAll('${precio}', '$69');
}

// What a person should do next with this lead, following the manual.
function playbookFor(l, i) {
  const a = (l.qual && l.qual.answers) || {}, nq = H.nextQuestion(l);
  const tips = [];
  if (a.compare === 'many' || a.compare === 'few') tips.push(['Está comparando precios', 'objeciones', 1]);
  if (a.decider === 'shared') tips.push(['Lo consulta con su pareja', 'objeciones', 3]);
  if (a.timing === 'later') tips.push(['Solo está cotizando', 'objeciones', 2]);
  let step;
  if (l.status === 'ganado') step = { title: 'Después del trabajo: fotos, reseña y membresía', sec: 'despues', script: MANUAL.find((m) => m.id === 'upselling').scripts[0] };
  else if (l.status === 'perdido') step = { title: 'Registrar el motivo de la pérdida y ofrecer la membresía más adelante', sec: 'seguimiento' };
  else if (nq) step = { title: `Hacer la pregunta pendiente: ${nq.label.toLowerCase()}`, sec: 'calificar', script: ['Pregunta', nq.en, nq.es] };
  else if (l.status === 'cotizado') step = { title: 'Seguimiento a la cotización (día 1)', sec: 'seguimiento', script: MANUAL.find((m) => m.id === 'seguimiento').scripts[0] };
  else step = { title: i.prob >= 70 ? 'Lead caliente: enviar cotización y cerrar hoy' : 'Enviar la cotización hoy', sec: 'cotizar', script: MANUAL.find((m) => m.id === 'cotizar').scripts[0] };
  const obj = MANUAL.find((m) => m.id === 'objeciones').objections;
  return `<div class="playbook">
    <div class="pb-h"><div><span class="sec-t" style="margin:0">Si atiende una persona</span><b>${esc(step.title)}</b></div><button class="btn btn-ghost btn-sm" data-manual="${step.sec}">Ver en el manual →</button></div>
    ${step.script ? scriptBox(step.script[0], step.script[1], step.script[2], l) : ''}
    ${tips.length ? `<div class="sm muted">Prepárate para:</div>${tips.map(([t, , n]) => `<details class="pb-obj"><summary>${esc(t)}</summary><p class="sm muted" style="margin:6px 0">${esc(obj[n][1])}</p>${scriptBox('Qué responder', obj[n][2], obj[n][3], l)}</details>`).join('')}` : ''}
  </div>`;
}

// ---------- agenda calendar ----------
const DAY_START = 7, DAY_END = 19, HOUR_PX = 66;
const WORK_DAYS = [0, 1, 2, 3, 4, 5]; // Monday to Saturday; Near Me Best Work doesn't work Sundays
const isSunday = (d) => new Date(d + 'T12:00:00').getDay() === 0;
const SVC_HOURS = { house: 2, driveway: 1, roof: 3, pool: 1.5, paver: 3, fence: 1.5, screen: 2 };
const jobHours = (j) => Math.min(6, Math.max(1, j.services.reduce((h, id) => h + (SVC_HOURS[id] || 1), 0)));
const toHours = (t) => { const [h, m] = t.split(':').map(Number); return h + m / 60; };
const fmtHour = (h) => `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.round((h % 1) * 60)).padStart(2, '0')}`;
const weekStart = (d) => { const x = new Date(d + 'T12:00:00'); const dow = (x.getDay() + 6) % 7; return H.addDays(d, -dow); };
const calJobs = () => S.jobs.filter((j) => ui.calTech === 'all' || j.techId === ui.calTech);

// Side-by-side lanes for jobs that overlap in the same column.
function layoutLanes(jobs) {
  const items = jobs.map((j) => ({ j, a: toHours(j.time), b: toHours(j.time) + jobHours(j) })).sort((x, y) => x.a - y.a);
  let cluster = [], clusterEnd = -1;
  const flush = () => { const lanes = []; cluster.forEach((it) => { let k = lanes.findIndex((end) => end <= it.a); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = it.b; it.lane = k; }); cluster.forEach((it) => (it.lanes = lanes.length)); };
  items.forEach((it) => { if (it.a >= clusterEnd && cluster.length) { flush(); cluster = []; } cluster.push(it); clusterEnd = Math.max(clusterEnd, it.b); });
  if (cluster.length) flush();
  return items;
}

function calEvent(it, showTech) {
  const { j } = it, t = tech(j.techId), c = client(j.clientId);
  const top = (Math.max(it.a, DAY_START) - DAY_START) * HOUR_PX, height = Math.max(26, (Math.min(it.b, DAY_END) - Math.max(it.a, DAY_START)) * HOUR_PX - 4);
  const w = 100 / it.lanes;
  const icon = j.status === 'completado' ? '✓ ' : j.status === 'en_curso' ? '● ' : '';
  return `<div class="ev ${j.status === 'completado' ? 'done' : ''}" data-job="${j.id}" title="${esc(c.name)} · ${svcList(j.services)}" style="top:${top}px; height:${height}px; left:calc(${it.lane * w}% + 3px); width:calc(${w}% - 6px); background:${t.color}1f; border-left-color:${t.color}">
    <b>${icon}${fmtHour(it.a)}–${fmtHour(it.b)}</b><span class="ev-name">${esc(c.name)}${j.memberId ? ' ★' : ''}</span>
    ${height > 60 ? `<span class="ev-sub">${svcList(j.services)}</span>` : ''}${showTech && height > 86 ? `<span class="ev-sub">${t.name.split(' ')[0]}</span>` : ''}</div>`;
}

function timeGrid(columns, minCol = 150) {
  const hours = []; for (let h = DAY_START; h < DAY_END; h++) hours.push(h);
  const T = H.today(), nowH = new Date().getHours() + new Date().getMinutes() / 60;
  // A day with overlapping jobs gets proportionally wider so blocks don't get squeezed.
  columns.forEach((c) => { c.laid = layoutLanes(c.jobs); c.lanes = Math.max(1, ...c.laid.map((it) => it.lanes)); });
  const tpl = columns.map((c) => `minmax(${Math.max(minCol, c.lanes * 100)}px, ${c.lanes}fr)`).join(' ');
  return `<div class="cal" style="grid-template-columns:58px ${tpl}">
    <div class="cal-corner"></div>${columns.map((c) => `<div class="cal-head ${c.today ? 'today' : ''}" ${c.go ? `data-calgo="${c.go}"` : ''}>${c.head}</div>`).join('')}
    <div class="cal-hours">${hours.map((h) => `<div style="height:${HOUR_PX}px">${String(h).padStart(2, '0')}:00</div>`).join('')}</div>
    ${columns.map((c) => `<div class="cal-col" style="height:${(DAY_END - DAY_START) * HOUR_PX}px">
      ${hours.map((h) => `<div class="slot" style="top:${(h - DAY_START) * HOUR_PX}px; height:${HOUR_PX}px" data-slot="${c.date}|${String(h).padStart(2, '0')}:00|${c.techId || ''}"></div>`).join('')}
      ${c.date === T && nowH > DAY_START && nowH < DAY_END ? `<div class="now-line" style="top:${(nowH - DAY_START) * HOUR_PX}px"></div>` : ''}
      ${c.laid.map((it) => calEvent(it, c.showTech)).join('')}
    </div>`).join('')}
  </div>`;
}

function vTrabajos() {
  const d = ui.jobDate, mode = ui.calMode, T = H.today();
  let title, body, inRange;
  if (mode === 'dia') {
    const techs = TECHS.filter((t) => ui.calTech === 'all' || t.id === ui.calTech);
    const dayJobs = calJobs().filter((j) => j.date === d);
    inRange = dayJobs;
    title = fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    body = isSunday(d) ? '<div class="card locked-view"><h3 style="color:var(--navy)">Domingo · no se trabaja</h3><p class="muted" style="margin:0">La agenda va de lunes a sábado.</p></div>' : timeGrid(techs.map((t) => ({ date: d, techId: t.id, today: d === T, head: `<span class="dot" style="background:${t.color}"></span>${t.name} <span class="muted">${dayJobs.filter((j) => j.techId === t.id).length}</span>`, jobs: dayJobs.filter((j) => j.techId === t.id) })));
  } else if (mode === 'semana') {
    const ws = weekStart(d), days = WORK_DAYS.map((i) => H.addDays(ws, i));
    inRange = calJobs().filter((j) => j.date >= days[0] && j.date <= days[5]);
    title = `${fmtDate(days[0], { day: 'numeric', month: 'short' })} – ${fmtDate(days[5], { day: 'numeric', month: 'short', year: 'numeric' })} · lunes a sábado`;
    body = timeGrid(days.map((day) => ({ date: day, today: day === T, go: day, showTech: true, head: `<span class="wd">${fmtDate(day, { weekday: 'short' })}</span> <span class="dn">${Number(day.slice(8))}</span>`, jobs: inRange.filter((j) => j.date === day) })), 130);
  } else {
    const first = d.slice(0, 8) + '01', gs = weekStart(first);
    const cells = Array.from({ length: 6 }, (_, w) => WORK_DAYS.map((i) => H.addDays(gs, w * 7 + i))).flat();
    inRange = calJobs().filter((j) => j.date.slice(0, 7) === d.slice(0, 7));
    title = fmtDate(first, { month: 'long', year: 'numeric' });

function openDrawer(html) { document.getElementById('drawer').innerHTML = html; document.getElementById('drawer').classList.add('on'); document.getElementById('drawerBg').classList.add('on'); }

function leadDrawer(id) {
  const l = S.leads.find((x) => x.id === id); if (!l) return;
  ui.drawer = ['lead', id];
  if (l.isNew) { DB.update((s) => { const x = s.leads.find((y) => y.id === id); delete x.isNew; }); S = DB.load(); }
  const i = H.leadInsight(l);
  const a = (l.qual && l.qual.answers) || {};
  const nq = H.nextQuestion(l);
  const closed = l.status === 'ganado' || l.status === 'perdido';
  openDrawer(`
    <div class="dh"><div><h2>${esc(l.name)}</h2><div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap">${originChip(l.origin)}<span class="chip gray">${l.channel}</span><span class="chip gray">${esc(l.phone)}</span></div></div><button class="x" data-act="close">×</button></div>
    <div class="db">
      <div class="qual">
        <div class="qual-top">${probRing(i.prob, 72)}<div style="display:grid; gap:6px"><div class="sec-t" style="margin:0">Calificación del asistente</div>${closed ? `<span class="chip ${l.status === 'ganado' ? 'green' : 'red'}">${l.status === 'ganado' ? 'Ganado' : 'Perdido'}</span>` : urgChip(i.urgency)}<div class="row">${i.signals.map((x) => `<span class="chip sky">${x}</span>`).join('')}</div></div></div>
        <div class="qual-steps">${H.QUAL.map((q) => `<div class="qs ${a[q.id] ? 'ok' : nq && nq.id === q.id ? 'now' : ''}"><span>${q.label}</span><b>${a[q.id] ? answerText(q.id, a[q.id]) : nq && nq.id === q.id ? 'Esperando respuesta…' : '—'}</b></div>`).join('')}</div>
        ${i.task && !i.task.auto ? `<div class="next-task"><div><span class="sec-t" style="margin:0">Siguiente paso</span><b>${esc(i.task.title)}</b></div><button class="btn btn-navy btn-sm" data-taskdone="${i.task.key}">${(S.taskDone || {})[i.task.key] ? 'Hecha ✓' : 'Marcar hecha'}</button></div>` : ''}
        ${nq && !closed ? `<div class="sim"><span class="sm muted">Demo · simula lo que responde el cliente:</span><div class="quick">${nq.opts.map((o) => `<button class="btn btn-ghost btn-sm" data-ans="${o[0]}">${o[1]}</button>`).join('')}<button class="btn btn-gold btn-sm" data-act="autoqual">▶ Completar conversación</button></div></div>` : ''}
      </div>
      ${playbookFor(l, i)}
      <dl class="kv"><dt>Interés</dt><dd>${svcList(l.services)}</dd><dt>Valor estimado</dt><dd>${l.value ? usd(l.value) : '—'}</dd><dt>Entró</dt><dd>${fmtDate(l.createdAt, { day: 'numeric', month: 'long' })}</dd>
      <dt>Etapa</dt><dd><select class="input" style="padding:6px 8px" id="leadStatus">${['nuevo', 'contactado', 'cotizado', 'ganado', 'perdido'].map((st) => `<option ${st === l.status ? 'selected' : ''}>${st}</option>`).join('')}</select></dd></dl>
      <div>
        <div class="wa-head"><span class="g"></span>WhatsApp · el asistente responde y David puede intervenir cuando quiera</div>
        <div class="wa" id="wa">${l.messages.map((m) => `<div class="m ${m.dir}">${m.dir === 'bot' ? '<span class="who">🤖 Asistente</span>' : ''}${esc(m.text)}<time>${m.at.slice(11, 16) || ''}</time></div>`).join('') || '<div class="empty">Sin mensajes aún.</div>'}</div>
      </div>
      <div class="quick">
        ${l.value ? `<button class="btn btn-ghost btn-sm" data-qr="quote">Enviar cotización (${usd(l.value)})</button>` : ''}

    </div>`);
  const wa = document.getElementById('wa'); wa.scrollTop = wa.scrollHeight;
}

function answerLead(id, key) {
  const before = H.leadInsight(S.leads.find((x) => x.id === id));
  let ev;
  DB.update((s) => H.answerAssistant(s.leads.find((x) => x.id === id), key));
  S = DB.load();
  const l = S.leads.find((x) => x.id === id), after = H.leadInsight(l);
  if (after.done && !before.done) { ev = `El asistente calificó a ${l.name}: ${after.prob}% de cierre, urgencia ${after.urgency}`; DB.update(() => {}, { kind: 'lead', text: ev }); S = DB.load(); seenEvents.add(S.events[0].id); toast('🤖 ' + esc(ev)); }
  render(); leadDrawer(id);
}

function jobDrawer(id) {
  const j = S.jobs.find((x) => x.id === id); if (!j) return;
  ui.drawer = ['job', id];
  const c = client(j.clientId);
  const photos = j.before.length || j.after.length;
  openDrawer(`
    <div class="dh"><div><h2>${esc(c.name)}</h2><div class="muted sm" style="margin-top:4px">${fmtDate(j.date, { weekday: 'long', day: 'numeric', month: 'long' })} · ${j.time}</div></div><button class="x" data-act="close">×</button></div>
    <div class="db">
      <div style="display:flex; gap:8px; flex-wrap:wrap">${statusChip(j.status)}${j.memberId ? '<span class="chip sky">Visita de membresía</span>' : ''}</div>
      <dl class="kv"><dt>Dirección</dt><dd>${esc(c.address)}</dd><dt>Teléfono</dt><dd>${esc(c.phone)}</dd><dt>Servicios</dt><dd>${svcList(j.services)}</dd><dt>Técnico</dt><dd><span class="dot" style="background:${tech(j.techId).color}"></span>${tech(j.techId).name}</dd>
      <dt>Valor</dt><dd>${j.memberId && !j.amount ? 'Incluido en la membresía' : usd(j.amount)}</dd>${j.method ? `<dt>Medio de pago</dt><dd>${j.method}</dd>` : ''}${j.completedAt ? `<dt>Cerrado</dt><dd>${j.completedAt.slice(11, 16)} desde la app de campo</dd>` : ''}${j.notes ? `<dt>Notas</dt><dd>${esc(j.notes)}</dd>` : ''}</dl>
      ${photos ? `<div><div class="sec-t">Antes y después</div><div class="ba">${j.before.map((p) => `<img src="${H.photoSrc(p)}" alt="Antes">`).join('')}${j.after.map((p) => `<img src="${H.photoSrc(p)}" alt="Después">`).join('')}</div></div>` : `<div class="muted sm">Las fotos de antes y después aparecen aquí cuando el técnico las sube desde la app.</div>`}
      ${j.status !== 'completado' ? `<label class="field">Reasignar técnico<select class="input" id="reassign">${TECHS.map((t) => `<option value="${t.id}" ${t.id === j.techId ? 'selected' : ''}>${t.name}</option>`).join('')}</select></label>` : ''}
      <button class="btn btn-ghost" data-client="${c.id}">Ver historial del cliente</button>
    </div>`);
}

function clientDrawer(id) {
  const c = S.clients.find((x) => x.id === id); if (!c) return;
  ui.drawer = ['client', id];
  const m = memberOf(c.id);
  if (m && m.isNew) { DB.update((s) => { delete s.members.find((y) => y.id === m.id).isNew; }); S = DB.load(); }
  const jobs = S.jobs.filter((j) => j.clientId === c.id).sort((a, b) => b.date.localeCompare(a.date));
  const pays = S.payments.filter((p) => p.clientId === c.id);
  openDrawer(`
    <div class="dh"><div><h2>${esc(c.name)}</h2><div style="display:flex; gap:6px; margin-top:8px">${originChip(c.origin)}${m ? planChip(m.plan) : ''}</div></div><button class="x" data-act="close">×</button></div>
    <div class="db">
      <dl class="kv"><dt>Teléfono</dt><dd>${esc(c.phone)}</dd><dt>Email</dt><dd>${esc(c.email || '—')}</dd><dt>Dirección</dt><dd>${esc(c.address)}</dd>${c.sqft ? `<dt>Área habitable</dt><dd>${c.sqft.toLocaleString('en-US')} pie² (registro del condado)</dd>` : ''}<dt>Total pagado</dt><dd>${usd(pays.reduce((s, p) => s + p.amount, 0))}</dd></dl>
      ${m ? `<div class="card" style="background:var(--bg)"><div class="card-head" style="margin-bottom:8px"><h3>Membresía ${PLANS[m.plan].name} · banda ${m.band}</h3><span class="chip green">Activa</span></div>
        <div class="sm muted" style="margin-bottom:10px">${usd(m.price)}${m.billing === 'annual' ? ' al año' : ' al mes, cobro automático con Square'} · desde ${fmtDate(m.start, { day: 'numeric', month: 'long', year: 'numeric' })}</div>
        <table class="t sm"><tbody>${m.visits.map((v) => `<tr><td>${svc(v.svc).es}</td><td>${fmtDate(v.due)}</td><td class="num">${v.status === 'hecha' ? '<span class="chip green">Hecha</span>' : v.status === 'agendada' ? '<span class="chip sky">Agendada</span>' : `<button class="btn btn-navy btn-sm" data-sched="${m.id}|${v.id}">Agendar</button>`}</td></tr>`).join('')}</tbody></table></div>` : `<button class="btn btn-ghost" data-act="soon">Ofrecer membresía por WhatsApp</button>`}
      <div><div class="sec-t">Historial de trabajos</div>
        ${jobs.map((j) => `<div class="job ${j.status === 'completado' ? 'done' : ''}" data-job="${j.id}"><div style="display:flex; justify-content:space-between"><b>${fmtDate(j.date, { day: 'numeric', month: 'short', year: 'numeric' })}</b>${statusChip(j.status)}</div><div class="sm">${svcList(j.services)} · ${j.memberId ? 'Membresía' : usd(j.amount)}</div>${j.after.length ? thumbs([...j.before, ...j.after]) : ''}</div>`).join('') || '<div class="muted sm">Aún sin trabajos.</div>'}
      </div>
    </div>`);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-manual],[data-mlang],[data-copy],[data-taskdone],[data-ans],[data-go],[data-lead],[data-job],[data-client],[data-act],[data-lf],[data-day],[data-cday],[data-sched],[data-qr],[data-calnav],[data-calmode],[data-caltech],[data-calgo],[data-slot]');
  if (!t) return;
  const d = t.dataset;
  if (d.manual) {
    ui.view = 'manual'; ui.manualSec = d.manual; closeDrawer(); render();
    document.getElementById('man-' + d.manual)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (d.mlang) { ui.manualLang = d.mlang; return render(); }
  if (d.copy !== undefined) { navigator.clipboard?.writeText(d.copy).catch(() => {}); return toast('Guion copiado. Pégalo en WhatsApp.'); }
  if (d.taskdone) {
    e.stopPropagation();
    const key = d.taskdone, wasDone = (S.taskDone || {})[key];
    save((st) => { st.taskDone = st.taskDone || {}; if (wasDone) delete st.taskDone[key]; else st.taskDone[key] = new Date().toISOString(); });
    if (!wasDone) toast('Tarea completada.');
    if (ui.drawer && ui.drawer[0] === 'lead') leadDrawer(ui.drawer[1]);
    return;
  }
  if (d.ans) return answerLead(ui.drawer[1], d.ans);
  if (d.act === 'share') { e.stopPropagation(); toast('Foto lista para publicar (en la versión real se descarga en formato para Instagram y TikTok).'); return; }
  if (d.go) { ui.view = d.go; closeDrawer(); render(); window.scrollTo(0, 0); return; }
  if (d.lead) return leadDrawer(d.lead);
  if (d.job) return jobDrawer(d.job);
  if (d.client) return clientDrawer(d.client);
  if (d.lf) { ui.leadFilter = d.lf; return render(); }
  if (d.calmode) { ui.calMode = d.calmode; return render(); }
  if (d.caltech) { ui.calTech = d.caltech; return render(); }
  if (d.calgo) { ui.jobDate = d.calgo; ui.calMode = 'dia'; return render(); }
  if (d.calnav !== undefined) {
    const n = Number(d.calnav);
    if (n === 0) ui.jobDate = H.today();
    else if (ui.calMode === 'dia') { ui.jobDate = H.addDays(ui.jobDate, n); if (isSunday(ui.jobDate)) ui.jobDate = H.addDays(ui.jobDate, n); }
    else if (ui.calMode === 'semana') ui.jobDate = H.addDays(ui.jobDate, 7 * n);
    else { const x = new Date(ui.jobDate.slice(0, 8) + '01T12:00:00'); x.setMonth(x.getMonth() + n); ui.jobDate = H.iso(x); }
    return render();
  }
  if (d.slot) { const [date, time, techId] = d.slot.split('|'); return jobModal({ date, time, techId, title: `Nuevo trabajo · ${fmtDate(date, { weekday: 'long', day: 'numeric', month: 'short' })} ${time}` }); }
  if (d.day !== undefined) { ui.jobDate = d.day === '0' ? H.today() : H.addDays(ui.jobDate, Number(d.day)); return render(); }
  if (d.cday !== undefined) { ui.contaDate = d.cday === '0' ? H.today() : H.addDays(ui.contaDate, Number(d.cday)); return render(); }
  if (d.sched) {
    const [mid, vid] = d.sched.split('|');
    const m = S.members.find((x) => x.id === mid), v = m.visits.find((x) => x.id === vid);
    return jobModal({ clientId: m.clientId, services: [v.svc], date: v.due < H.today() ? H.addDays(H.today(), 1) : v.due, memberRef: d.sched, title: `Agendar ${svc(v.svc).es} · membresía ${PLANS[m.plan].name}` });
  }
  if (d.qr) {
    const l = S.leads.find((x) => x.id === ui.drawer[1]);
    const lastIn = [...l.messages].reverse().find((m) => m.dir === 'in');
    const es = lastIn ? /\b(hola|necesito|quiero|gracias|casa|me|el|la|por favor)\b/i.test(lastIn.text) : l.channel === 'Walk-in';
    const first = l.name.split(' ')[0];
    const text = es
      ? { quote: `Hola ${first}, gracias por escribirnos. Para ${svcList(l.services).toLowerCase()} el valor es ${usd(l.value)}. ¿Qué día le queda bien?`, member: 'Por cierto: su casa puede quedar así todo el año desde $34 al mes con nuestra membresía. Vea su precio aquí: nearmebestwork.com/membership', photos: '¿Nos puede enviar un par de fotos del área para darle el precio exacto?' }[d.qr]
      : { quote: `Hi ${first}, thanks for reaching out! ${l.services.map((id) => svc(id).name).join(' + ')} comes to ${usd(l.value)}. What day works best for you?`, member: 'By the way: your home can stay this clean all year from $34/month with our Best Work Membership. See your price: nearmebestwork.com/membership', photos: 'Could you send us a couple of photos of the area so we can give you an exact price?' }[d.qr];
    document.querySelector('#replyForm input').value = text; return;
  }
  switch (d.act) {
    case 'close': return closeDrawer();
    case 'closeModal': return closeModal();
    case 'newJob': return jobModal();
    case 'newLead': return openModal(`<h3>Registrar lead</h3><form id="leadForm" style="display:grid; gap:12px">
      <div class="row2"><label class="field">Nombre<input class="input" name="name" required></label><label class="field">Teléfono<input class="input" name="phone" required></label></div>
      <div class="row2"><label class="field">Idioma del cliente<select class="input" name="lang"><option value="en">Inglés</option><option value="es">Español</option></select></label><span></span></div>
      <div class="row2"><label class="field">Canal<select class="input" name="channel"><option>Llamada</option><option>Walk-in</option><option>WhatsApp</option></select></label><label class="field">Origen<select class="input" name="origin"><option>Orgánico</option><option>Referido</option><option>Google</option><option>Thumbtack</option></select></label></div>
      <div class="field">Interés<div class="checks">${SERVICES.map((s) => `<label><input type="checkbox" name="svc" value="${s.id}">${s.es}</label>`).join('')}</div></div>
      <div style="display:flex; gap:8px; justify-content:flex-end"><button type="button" class="btn btn-ghost" data-act="closeModal">Cancelar</button><button class="btn btn-navy">Guardar</button></div></form>`);
    case 'convert': {
      const l = S.leads.find((x) => x.id === d.id);
      let c = S.clients.find((x) => x.name === l.name);
      if (!c) { const cid = H.uid('c'); save((s) => { s.clients.unshift({ id: cid, name: l.name, phone: l.phone, email: '', address: 'Dirección por confirmar, Orlando, FL', sqft: null, origin: l.origin, createdAt: H.today() }); }); c = S.clients.find((x) => x.id === cid); }
      closeDrawer();
      return jobModal({ clientId: c.id, services: l.services, title: `Agendar trabajo · ${l.name}`, leadId: l.id });
    }
    case 'sendReport': save((s) => { s.reportsSent[ui.contaDate] = new Date().toISOString(); }, { kind: 'report', text: `Resumen del ${fmtDate(ui.contaDate)} enviado a la contadora` }); return toast('Resumen enviado a Patricia (simulado). En la versión real le llega por correo y lo ve en su usuario.');
    case 'csv': {
      const rows = [['fecha', 'tipo', 'cliente/concepto', 'medio', 'monto']];
      S.payments.filter((p) => p.date === ui.contaDate).forEach((p) => rows.push([p.date, 'entró · ' + p.type, client(p.clientId).name, p.method, p.amount]));
      S.expenses.filter((x) => x.date === ui.contaDate).forEach((x) => rows.push([x.date, 'salió', x.concept, '', -x.amount]));
      const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')); a.download = `resumen-${ui.contaDate}.csv`; a.click(); return;
    }
    case 'migrate': {
      const box = document.getElementById('mig-' + d.id), bar = box.querySelector('.progress div'); t.disabled = true; let p = 0;
      const iv = setInterval(() => { p += 9; bar.style.width = Math.min(p, 100) + '%'; if (p >= 100) { clearInterval(iv); t.textContent = d.id === 'zoho' ? '42 clientes y 186 trabajos importados' : 'Ingresos y gastos del año importados'; toast('Importación simulada completa. En F0 se hace con los datos reales de David.'); } }, 120); return;
    }
    case 'soon': return toast('Disponible en la versión real.');
    case 'autoqual': {
      const id = ui.drawer[1];
      const step = () => {
        const l = S.leads.find((x) => x.id === id), q = l && H.nextQuestion(l);
        if (!q || !ui.drawer || ui.drawer[1] !== id) return;
        answerLead(id, q.opts[Math.random() < 0.7 ? 0 : 1][0]);
        setTimeout(step, 900);
      };
      return step();
    }
    case 'togglePins': ui.showPins = !ui.showPins; return render();
    case 'changePin': {
      if (ui.role !== 'owner') return toast('Solo David puede cambiar los PIN.');
      const tt = tech(d.id);
      return openModal(`<h3>Cambiar PIN · ${esc(tt.name)}</h3>
        <p class="muted sm" style="margin:0; line-height:1.5">El PIN anterior deja de funcionar al guardar y ${esc(tt.name.split(' ')[0])} tendrá que volver a entrar a la app con el nuevo.</p>
        <form id="pinForm" style="display:grid; gap:12px" autocomplete="off">
          <input type="hidden" name="techId" value="${d.id}">
          <div class="row2"><label class="field">PIN nuevo<input class="input pin-input" name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label><label class="field">Confirmar PIN<input class="input pin-input" name="pin2" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></label></div>
          <button type="button" class="btn btn-ghost btn-sm" data-act="randomPin" style="justify-self:start">Generar uno al azar</button>
          <p class="form-err" id="pinErr"></p>
          <div style="display:flex; gap:8px; justify-content:flex-end"><button type="button" class="btn btn-ghost" data-act="closeModal">Cancelar</button><button class="btn btn-navy">Guardar PIN</button></div>
        </form>`);
    }
    case 'randomPin': {
      const used = TECHS.map((x) => H.techPin(S, x.id));
      let p; do { p = String(Math.floor(Math.random() * 10000)).padStart(4, '0'); } while (used.includes(p) || /^(\d)\1{3}$/.test(p));
      const f = document.getElementById('pinForm'); f.pin.value = p; f.pin2.value = p; f.pin.type = 'text'; return;
    }
  }
});
document.getElementById('drawerBg').onclick = closeDrawer;
document.getElementById('modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') closeModal(); });

document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f);
  if (f.id === 'replyForm') {
    const text = fd.get('t').trim(); if (!text) return;
    const id = ui.drawer[1];
    save((s) => { const l = s.leads.find((x) => x.id === id); l.messages.push({ dir: 'out', text, at: H.stamp() }); if (l.status === 'nuevo') l.status = 'contactado'; });
    leadDrawer(id);
  }
  if (f.id === 'jobForm') {
    const memberRef = fd.get('memberRef'), leadId = fd.get('leadId');
    let clientId = fd.get('clientId'), services = fd.getAll('svc');
    let memberId = null;
    if (memberRef) { const [mid, vid] = memberRef.split('|'); const m = S.members.find((x) => x.id === mid); clientId = m.clientId; services = [m.visits.find((v) => v.id === vid).svc]; memberId = mid; }
    if (!services.length) return toast('Elige al menos un servicio.');
    const job = { id: H.uid('j'), clientId, date: fd.get('date'), time: fd.get('time'), services, techId: fd.get('techId'), status: 'programado', amount: memberId ? 0 : services.reduce((s, id) => s + svc(id).price, 0), method: '', before: [], after: [], notes: fd.get('notes') || '', completedAt: null, memberId };
    save((s) => {
      s.jobs.push(job);
      if (memberRef) { const [mid, vid] = memberRef.split('|'); const v = s.members.find((x) => x.id === mid).visits.find((x) => x.id === vid); v.status = 'agendada'; v.jobId = job.id; v.due = job.date; }
      if (leadId) s.leads.find((x) => x.id === leadId).status = 'ganado';
    });
    closeModal(); closeDrawer();
    toast(`Agendado con ${tech(job.techId).name} el ${fmtDate(job.date)} a las ${job.time}. ${job.date === H.today() ? 'Ya aparece en su app.' : ''}`);
  }
  if (f.id === 'leadForm') {
    const services = fd.getAll('svc');
    save((s) => { const lead = { id: H.uid('l'), name: fd.get('name'), phone: fd.get('phone'), channel: fd.get('channel'), origin: fd.get('origin'), lang: fd.get('lang'), status: 'nuevo', services, value: services.reduce((a, id) => a + svc(id).price, 0), createdAt: H.today(), messages: [] }; H.startAssistant(lead); s.leads.unshift(lead); }, { kind: 'lead', text: `Lead registrado (${fd.get('channel')}) · ${fd.get('name')}. El asistente ya le escribió por WhatsApp.` });
    closeModal();
  }
  if (f.id === 'pinForm') {
    const id = fd.get('techId'), pin = fd.get('pin').trim(), err = document.getElementById('pinErr');
    const others = TECHS.filter((x) => x.id !== id).map((x) => H.techPin(S, x.id));
    if (!/^\d{4}$/.test(pin)) { err.textContent = 'El PIN debe tener exactamente 4 números.'; return; }
    if (pin !== fd.get('pin2').trim()) { err.textContent = 'Los dos PIN no coinciden.'; return; }
    if (/^(\d)\1{3}$/.test(pin) || pin === '1234') { err.textContent = 'Ese PIN es muy fácil de adivinar.'; return; }
    if (pin === H.techPin(S, id)) { err.textContent = 'Es el mismo PIN de ahora.'; return; }
    if (others.includes(pin)) { err.textContent = 'Otro técnico ya usa ese PIN.'; return; }
    const name = tech(id).name;
    save((s) => { s.pins = s.pins || {}; s.pins[id] = { pin, changedAt: new Date().toISOString() }; }, { kind: 'report', text: `David cambió el PIN de ${name}` });
    closeModal();
    toast(`PIN de ${esc(name.split(' ')[0])} actualizado. Si tenía la app abierta, se le cerró la sesión.`);
  }
  if (f.id === 'expForm') save((s) => s.expenses.push({ id: H.uid('e'), date: ui.contaDate, concept: fd.get('concept'), amount: Number(fd.get('amount')) }));
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'jobDate') { ui.jobDate = e.target.value; render(); }
  if (e.target.id === 'contaDate') { ui.contaDate = e.target.value; render(); }
  if (e.target.id === 'leadStatus') { const id = ui.drawer[1]; save((s) => (s.leads.find((x) => x.id === id).status = e.target.value)); }
  if (e.target.id === 'reassign') { const id = ui.drawer[1]; save((s) => (s.jobs.find((x) => x.id === id).techId = e.target.value)); toast('Técnico reasignado. El trabajo cambia de app al instante.'); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'clientQ') { ui.clientQ = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('clientQ'); el.focus(); el.setSelectionRange(pos, pos); }
});

// CRM pipeline: drag a lead card onto another column to change its stage.
const STAGE_LABEL = { nuevo: 'Nuevos', contactado: 'Contactados', cotizado: 'Cotizados', ganado: 'Ganados', perdido: 'Perdidos' };
let dragLead = null;
document.addEventListener('dragstart', (e) => {
  const card = e.target.closest?.('.lead[data-lead]'); if (!card) return;
  dragLead = card.dataset.lead;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragLead);
  requestAnimationFrame(() => card.classList.add('dragging'));
});
document.addEventListener('dragover', (e) => {
  const col = dragLead && e.target.closest('.col[data-status]'); if (!col) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.col.drop-over').forEach((c) => c !== col && c.classList.remove('drop-over'));
  col.classList.add('drop-over');
});
document.addEventListener('drop', (e) => {
  const col = dragLead && e.target.closest('.col[data-status]'); if (!col) return;
  e.preventDefault();
  const id = dragLead, status = col.dataset.status;
  const l = S.leads.find((x) => x.id === id);
  dragLead = null;
  if (!l || l.status === status) return render();
  save((s) => { const x = s.leads.find((y) => y.id === id); x.status = status; delete x.isNew; });
  toast(`${esc(l.name)} pasó a <b>${STAGE_LABEL[status]}</b>.${status === 'ganado' ? ' Ábrela para convertirla en cliente y agendar.' : ''}`);
});
document.addEventListener('dragend', () => {
  dragLead = null;
  document.querySelectorAll('.dragging, .drop-over').forEach((el) => el.classList.remove('dragging', 'drop-over'));
});

const roleSel = document.getElementById('role');
roleSel.innerHTML = USERS.map((u) => `<option value="${u.id}">${u.name} · ${u.role}</option>`).join('');
roleSel.onchange = () => { ui.role = roleSel.value; ui.view = ROLE_VIEWS[ui.role][0] || 'panel'; closeDrawer(); render(); };
document.getElementById('resetBtn').onclick = () => { if (confirm('¿Volver a los datos de ejemplo? Se borra lo que se haya creado en la demo.')) { DB.reset(); S = DB.load(); seenEvents = new Set(); closeDrawer(); render(); toast('Demo reiniciada.'); } };
document.getElementById('today').textContent = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

// Live updates from the landing and the field app (other tabs).
DB.onChange((ns) => {
  S = ns;
  ns.events.filter((ev) => !seenEvents.has(ev.id)).reverse().forEach((ev) => { seenEvents.add(ev.id); toast('<b>En vivo</b> · ' + esc(ev.text)); });
  render();
  if (ui.drawer) ({ lead: leadDrawer, job: jobDrawer, client: clientDrawer })[ui.drawer[0]]?.(ui.drawer[1]);
});

render();
DB.ready().then(() => { S = DB.load(); seenEvents = new Set(S.events.map((e) => e.id)); render(); });
</script>
</body>
</html>
